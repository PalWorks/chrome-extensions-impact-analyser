<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="token" content="__TOKEN__">
<title>Chrome Firefox Browser Extensions Impact Analyser</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<script>try{const t=localStorage.getItem('eia-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch{}</script>
</head>
<body>
<header class="appbar">
  <div class="appbar-inner">
    <a class="brand" href="/" aria-label="Chrome Firefox Browser Extensions Impact Analyser, start over">
      <span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4.5 17a8.5 8.5 0 1 1 15 0"/><path d="M12 13l4-5"/><circle cx="12" cy="13" r="1.4" fill="currentColor"/></svg></span>
      <span class="brand-text"><b>Chrome Firefox Browser Extensions Impact Analyser</b><small>Find the extensions that slow down your browsing</small></span>
    </a>
    <nav class="tools" aria-label="App">
      <button type="button" class="icon" id="past-link" aria-label="Past reports" title="Past reports"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 17v-3M12 17v-6M15 17v-4"/></svg><span class="lbl" aria-hidden="true">Reports</span></button>
      <div class="seg" role="group" aria-label="Colour theme">
        <button type="button" class="icon" data-theme-set="auto" aria-pressed="true" aria-label="Match my device" title="Match my device"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 0 0 17z" fill="currentColor"/></svg><span class="lbl" aria-hidden="true">Auto</span></button>
        <button type="button" class="icon" data-theme-set="light" aria-pressed="false" aria-label="Light" title="Light"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="lbl" aria-hidden="true">Light</span></button>
        <button type="button" class="icon" data-theme-set="dark" aria-pressed="false" aria-label="Dark" title="Dark"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.6 6.6 0 0 0 10.7 10.7z"/></svg><span class="lbl" aria-hidden="true">Dark</span></button>
      </div>
    </nav>
  </div>
</header>
<main id="app" aria-live="polite">
  <div class="card skeleton" aria-hidden="true"></div>
  <noscript><p>This page needs JavaScript turned on.</p></noscript>
</main>
<footer class="foot">
  <div class="foot-main">
    <span class="made">Made by <a href="https://palworks.ai" target="_blank" rel="noopener">PalWorks</a></span>

    </nav>
  </div>
  <div class="foot-meta">
    <span><span id="version"></span> · Runs only on this computer</span>
    <button type="button" class="link" id="quit">Quit the app</button>
  </div>
</footer>

</body>
</html>
