name: Self-test

# Runs only when started by hand (Actions tab, or `gh workflow run self-test.yml`) or when a
# release tag such as v0.2.0 is pushed, to keep GitHub Actions use to a minimum. Day-to-day
# changes are checked locally with `npm run test:ai && npm run self-test`.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:ai
      - run: npm run self-test
      - run: npm run self-test:firefox
